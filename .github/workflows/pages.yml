name: Update catalogue & deploy Pages
on:
  push:
    branches: [main]
  schedule:
    # 04:17 UTC = 07:17 Europe/Minsk. GitHub may delay scheduled runs.
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Fetch and validate upstream catalogue
        run: npm run sync
      - name: Update GitHub popularity and discover missing artwork
        run: npm run enrich
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
      - name: Keep last successful snapshot and change history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/ public/assets/covers/
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh SwitchPorts catalogue [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
